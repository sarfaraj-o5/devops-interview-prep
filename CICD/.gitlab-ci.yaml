stages:
  - build
  - test
  - deploy 

variables:
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

build:
  stage: build
  script:
    - docker build -t registry.gitlab.com/org/app:$IMAGE_TAG .
    - docker push registry.gitlab.com/org/app:$IMAGE_TAG
  artifacts:
    paths:
      - [target/*.jar]
  tags:
    - [docker]

test:
  stage: test
  script: pytest tests/

deploy:
  stage: deploy
  script:
    - kubectl apply -f k8s/deployment.yaml
  only:
    - main
  environment:
    name: production
  when: manual
--- 
## parallel jobs
test:
  stage: test
  script: pytest
  parallel: 3
### OR
stages:
  - [build, test, deploy]

test_unit:
  stage: test
  script: pytest tests/unit

test_integration:
  stage: test
  script: pytest tests/integration

---

# gitlab ci multi-level stages with manual gates

stages:
  - [build, test, review, deploy]

build:
  stage: build
  script: docker build -t $CI_REGISTRY_IAMGE:$CI_COMMIT_SHORT_SHA .

test: 
  stage: test
  script: pytest

review:
  stage: review
  environment:
    name:  review/$CI_COMMIT_REF_SLUG
  script: helm upgrade --install app ./charts -f values-review.yaml

deploy_prod:
  stage: deploy
  when: manual
  environment: production
  script: helm upgrade --install app ./charts -f values-prod.yaml
  
---

## equivalent
test: 
  stage: test
  parallel:
    matrix:
      - NODE_VERSION: ["16", "18", "20"]
  script:
    - nvm use $NODE_VERSION
    - nvm ci && npm test

---
 
 ### ENV PROTECTION & MANUAL APPROVAL
deploy-prod:
  stage: deploy
  environment: 
    name: production
  when: manual
  script:
    helm upgrade --install app charts/app

---
 
### ROLLBACK WITH CONDITION
jobs:
  stage: deploy
    script:
      - helm upgrade --install app charts/app 
      - ./health_check.sh || helm rollback app 1

---

### TERRAFORM INFRA PROVISION + APP DEPLOY
stages: [Infra, deploy]
infra:
  stage: infra
  script:
    terraform init && terraform apply -auto-approve
deploy:
    stage: deploy
    script:
      helm upgrade --install app charts/app

---

### SECURITY SCANS & QUALITY GATES

stages:
  - [build, scan, deploy]
scan:
  stage: scan
  script: 
    - sonar-sonar
    - trivy image $CI_REGISTRY_IAMGE:$CI_COMMIT_SHORT_SHA

---

### MULTI-SERVICE(REPO OR MONOREPO) DEPLOY
build_serviceA:
  stage: build
  rules:
    - changes: 
        - serviceA/**

build_serviceA:
  stage: build
  rules:
    - changes: 
        - serviceA/**

### NOTIFICATION & MONITORING INTEGRATE
after_script:
  - curl -X POST -H 'Content-type: application/json' \
    --data '{"text":"GitLab Deploy Success"}'\
    $SLACK_WEBHOOK