name: CI Pipeline
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::12345:role/github-oidc
      - uses: actions/chekout@v4
      - name: Set up Node
      uses: actions/setup-node@v4
      with: 
        node-version: 20
      - run: npm ci && npm test
      - name: Docker Build & Push 
        run: |
          docker build -t ghcr.io/org/app:${{ github.sha }} .
          echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{github.actor }}--password-stdin
          docker push: ghcr.io/org/app:${{ github.sha }}
      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --name eks-prod
          kubectl apply -f k8s/deployment.yaml
---
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/chekout@v4
      - run: npm ci && npm test
      - run: docker build -t ghcr.io/org/app:${{ github.sha }}
      - run: helm upgrade --install app charts/app
      - run: echo ${{ secrets.KEY_NAME }}
---
## parallel jobs
jobs:
  build:
    strategy:
      matrix:
        node-version: [14, 16, 18]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/chekout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci && npm test
---

## Multi level workflow
name: Multi-Level Pipeline
on: [push]

jobs: 
  build:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/chekout@v4
      - run: npm ci && npm run build

test:
  needs: build
  runs-on: ubuntu-latest
  strategy:
    matrix:
      test-type: [unit, integration]
    steps:
      - uses: actions/chekout@v4
      - run: npm run test:${{ matrix.test-type }} 

deploy:
  needs: test
  runs-on: ubuntu-latest 
  environment: production
  steps:
    - run: helm upgrade --install app ./charts

---

### Matrix builds(parallel jobs/multi-version testing)
name: Node Matrix Build
on: [push]

jobs:
  test:
    strategy:
      matrix:
        node: [16, 18, 20]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${ {matrix.os }}
    steps:
      - uses: actions/chekout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ matrix.nod}}}
      - run: npm ci && npm test

---

### ENV PROTECTION & MANUAL APPROVAL
deploy-prod:
  runs-on: ubuntu-latest
  environment: 
    name: production
    url: https://app.example.com
    deployment_branch_policy: { protected_branches: true }
  steps:
    - run: helm upgrade --install app charts/app

---

# BLUE-GREEN WITH GITHUB ACTIONS
name: Blue-Green Deployment 
on: [workflow_dispatch]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/chekout@v4
      - run: |
          export INACTIVE=$(kubectl get svc app-svc -o jsonpath='{.spec.selector.color}' | grep blue && echo green || echo blue)
          helm upgrade --install app-$INACTIVE charts/app --set image.tag=${{ github.sha }} --set color=$INACTIVE 
          kubectl patch svc app-svc -p "{\"spec\":{\"selector\":{\"color\":\"$INACTIVE\"}}}"

---

# CANARY DEPLOY WITH GRADUAL ROLLOUT
name: Canary Deploy
on: [push]

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - run: helm upgrade --install app charts/app --set canaryWeight=10
      - run: ./validate_canary.sh
      - run: helm upgrade --install app charts/app --set canaryWeight=1000
---
### ROLLBACK WITH CONDITION
jobs:
  deploy:
    runs-on: ubuntu-latest 
    steps:
      - run: helm upgrade --install app charts/app --set image.tag=${{ github.sha }}
      - id: health
        run: ./health_check.sh
      - if: failure()
        run: helm rollback app 1

---

### TERRAFORM INFRA PROVISION + APP DEPLOY
name: Infra + App Deploy
on: [push]

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init && terraform apply -auto-approve
  deploy:
    needs: infra
    runs-on: ubuntu-latest
    steps:
      - run: helm upgrade --install app charts/app  
---

### SECURITY SCANS & QUALITY GATES
jobs:
  scan: 
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/chekout@v4
      - run: sonar-sonar
      - run: trivy image ghcr.io/org/app:${{ github.sha }}

---

### MULTI-SERVICE(REPO OR MONOREPO) DEPLOY
jobs: 
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.services }}
    steps:
      - uses: dorny/paths-filter@v3 
        id: changes 
        with:
          filters: |
            serviceA:
              - 'serviceA/**'
            serviceB:
              - 'serviceB/**'
deploy:
  needs: detect
  if: ${{ needs.detect.outputs.changed == 'serviceA' }}
  runs-on: ubuntu-latest
  steps: 
    - run: helm upgrade --install serviceA charts/serviceA

### NOTIFICATION & MONITORING INTEGRATE
- name: Notify Slack 
  uses: slackapi/slack-github-action@v1
  with:
    payload: |
      { "text": "Deployment Succeeded for ${{ github.ref }}"}
    env: 
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

