apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80

---
## backend deploy(node.js)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dev
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: myrepo/backend:1.0
        ports:
        - containerPort: 3000

        envFrom:
        - configMapRef:
          name: app-config 
        
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-secret 
              key: DB_USER

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret 
              key: DB_PASSWORD

        resources:
          requests:
            cpu: "250m" 
            memory: "256Mi" 
          limits:
            cpu: "500m" 
            memory: "512Mi"

---
## frontend deploy(nginx)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: nginx:latest
        ports:
        - containerPort: 80

        env:
        - name: BACKEND_URL
          value: http://backend.dev.svc.cluster.local

---
## backend deploy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dev
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: <ecr-url>/backend:1.0
        ports:
        - containerPort: 3000

        envFrom:
        - configMapRef: 
          name: db-config

        env: 
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_USER
        
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_PASSWORD